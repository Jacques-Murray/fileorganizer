[package]
name = "fileorganizer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
dirs = "7.0.0"
glob = "0.3.4"
infer = "0.22.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tabled = "0.22.0"
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "fo"
path = "src/main.rs"
